<!doctype html>
<html lang="fa" dir="rtl" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AstroBinesh — محاسبه دقیق چارت تولد با آیانامشای لاهیری، خانه‌های Whole Sign و ناوامشا (D9)" />
    <meta name="theme-color" content="#fff5f5" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>AstroBinesh — چارت تولد دقیق</title>

    <script>
      // Prevent theme flash: resolve the theme before React hydrates.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'dark' ? 'dark' : 'light'
          var el = document.documentElement
          el.classList.remove('light', 'dark')
          el.classList.add(theme)
          el.style.colorScheme = theme
        } catch (e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
